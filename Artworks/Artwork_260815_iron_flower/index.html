  <div id="titleOverlay">

    </div>
  </div>
  <div id="topGuide">
    <h3>鐵花</h3>
    <p>철의 꽃밭에 오신 것을 환영합니다.<br>
      차갑고 날카로운 꽃은 여러분의 손길을 기다리고 있습니다.<br>
      <br>
      마우스를 움직여 꽃을 피워주세요.<br>
      클릭해서 움직이거나 휠 조정하면 꽃밭을 둘러볼 수 있습니다.<br>
      <br>
      여러분의 흔적을 꽃밭에 남기세요. 다만 오래 남지는 않습니다.<br>
      철은 금방 식어버리니깐요.
    </p>
  </div>

    <p>Artwork by BamgasiJM</p>
  </div>
